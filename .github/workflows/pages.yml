name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, concepts/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the design concepts are published under /concepts/ while they are under review
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r concepts _site/concepts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
